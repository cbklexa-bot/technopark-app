name: Android development build

on:
  workflow_dispatch:
  push:
    branches:
      - smokehouse-android
      - koptilnya-ui-fixes-oct17
    paths:
      - 'smokehouse-android/**'
      - '.github/workflows/smokehouse-android-build.yml'

permissions:
  contents: read


concurrency:
  group: smokehouse-android-validation-${{ github.sha }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager was not found in $SDK_DIR" >&2; exit 1; fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        working-directory: smokehouse-android
        run: npm install --no-audit --no-fund
      - name: Install Chromium for UI integration tests
        working-directory: smokehouse-android
        run: npx playwright install --with-deps chromium
      - name: Build bundled web assets
        working-directory: smokehouse-android
        run: npm run build
      - name: Validate critical app features and functional UI flows
        working-directory: smokehouse-android
        run: npm test
      - name: Generate native Android project
        working-directory: smokehouse-android
        run: npx cap add android
      - name: Install direct-to-Downloads Android plugin
        working-directory: smokehouse-android
        run: node scripts/install-download-plugin.mjs
      - name: Generate branded Android launcher icon and splash assets
        working-directory: smokehouse-android
        run: |
          python -m pip install --disable-pip-version-check --no-input Pillow==12.3.0
          python scripts/generate_assets.py
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#192b25' --splashBackgroundColor '#192b25'
      - name: Sync web assets to Android
        working-directory: smokehouse-android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: smokehouse-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Package APK ZIP for convenient download
        shell: bash
        run: |
          cd smokehouse-android/android/app/build/outputs/apk/debug
          zip -j koptilnya-android-debug.zip app-debug.apk
      - name: Upload installable Android test APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: koptilnya-android-test-build
          if-no-files-found: error
          path: |
            smokehouse-android/android/app/build/outputs/apk/debug/app-debug.apk
            smokehouse-android/android/app/build/outputs/apk/debug/koptilnya-android-debug.zip
          retention-days: 14
