name: Koptilnya production-branch validation

on:
  workflow_dispatch:
  push:
    branches:
      - koptilnya-production
    paths:
      - 'supabase/**'
      - 'scripts/check-production-schema.mjs'
      - 'smokehouse-android/**'
      - '.github/workflows/koptilnya-production-check.yml'

permissions:
  contents: read

concurrency:
  group: koptilnya-production-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL SQL parser
        run: python -m pip install --disable-pip-version-check --no-input pglast
      - name: Parse migration with PostgreSQL grammar
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          paths = [
              Path('supabase/migrations/20261016150000_koptilnya_core.sql'),
              Path('supabase/tests/koptilnya_tenant_accounting.test.sql'),
          ]
          for path in paths:
              statements = parse_sql(path.read_text(encoding='utf-8'))
              print(f'PostgreSQL parser accepted {len(statements)} SQL statements in {path}.')
          PY
      - name: Check tenant, RLS, accounting, entitlement, and recipe-block contracts
        run: node scripts/check-production-schema.mjs

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: Confirm the CLI is running
        run: supabase --version
      - name: Start an isolated local Supabase stack and apply migrations
        run: supabase start
      - name: Run real PostgreSQL RLS and accounting tests using pgTAP
        run: supabase test db --local
      - name: Stop local containers
        if: always()
        run: supabase stop --no-backup

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        shell: bash
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager was not found in $SDK_DIR" >&2; exit 1; fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install JavaScript dependencies
        working-directory: smokehouse-android
        run: npm install --no-audit --no-fund
      - name: Validate app behavior and backup/import smoke tests
        working-directory: smokehouse-android
        run: npm test
      - name: Build bundled web app
        working-directory: smokehouse-android
        run: npm run build
      - name: Generate native Android project
        working-directory: smokehouse-android
        run: npx cap add android
      - name: Install direct-to-Downloads Android plugin
        working-directory: smokehouse-android
        run: node scripts/install-download-plugin.mjs
      - name: Generate Android artwork
        working-directory: smokehouse-android
        run: |
          python -m pip install --disable-pip-version-check --no-input Pillow==12.3.0
          python scripts/generate_assets.py
          npx capacitor-assets generate --android --assetPath assets --iconBackgroundColor '#192b25' --splashBackgroundColor '#192b25'
      - name: Sync web assets
        working-directory: smokehouse-android
        run: npx cap sync android
      - name: Build debug APK
        working-directory: smokehouse-android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Build unsigned Android App Bundle
        working-directory: smokehouse-android/android
        run: ./gradlew bundleRelease --no-daemon
      - name: Upload candidate packages
        uses: actions/upload-artifact@v4
        with:
          name: koptilnya-production-candidate
          if-no-files-found: error
          path: |
            smokehouse-android/android/app/build/outputs/apk/debug/app-debug.apk
            smokehouse-android/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
